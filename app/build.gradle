plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    namespace 'com.xinyi.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.xinyi.app"
        minSdk 19
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // 双渠道：验证 applicationId ≠ namespace 时 VB / 自定义控件仍可用
    flavorDimensions "channel"
    productFlavors {
        beta {
            dimension "channel"
            applicationId "com.xinyi.app.beta"
            resValue "string", "flavor_label", "内测渠道"
            buildConfigField "String", "FLAVOR_NAME", "\"beta\""
        }

        store {
            dimension "channel"
            applicationId "com.xinyi.app.store"
            resValue "string", "flavor_label", "商店渠道"
            buildConfigField "String", "FLAVOR_NAME", "\"store\""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material

    implementation project(':library')
}